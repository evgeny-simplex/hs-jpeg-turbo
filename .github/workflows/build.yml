name: build

on:
  workflow_dispatch:
    inputs:
      core:
        description: Commit of evgeny-simplex/simplex-chat whose Image.hs is measured as new; empty for master only
        type: string
        default: ""

defaults:
  run:
    shell: bash

env:
  BASE_CORE: 6b44de0a1187109d142f88566ab32cf39d1af8b3
  BASE_BINDING: c1b5080ea51adbde3bdaac6999431c43af8d84e8

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - id: matrix
        env:
          CORE: ${{ inputs.core }}
        run: |
          if [ -n "$CORE" ]; then
            echo 'versions=["base", "new"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["base"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - id: setup
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: 9.6.3
          cabal-version: 3.10.2.0

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: measure-store-${{ matrix.version }}-${{ hashFiles('.github/measure/png-measure.cabal', '*/*.cabal') }}
          restore-keys: measure-store-${{ matrix.version }}-

      - name: Prepare the project of Image.hs, ${{ matrix.version }}
        env:
          VERSION: ${{ matrix.version }}
          CORE: ${{ inputs.core }}
        run: |
          project="$RUNNER_TEMP/$VERSION"
          mkdir -p "$project/src/Simplex/Chat/Image"
          if [ "$VERSION" = base ]; then
            repository=simplex-chat/simplex-chat
            commit=$BASE_CORE
            git clone --quiet https://github.com/simplex-chat/hs-jpeg-turbo "$project/hjt"
            git -C "$project/hjt" checkout --quiet "$BASE_BINDING"
            git -C "$project/hjt" submodule update --init --quiet
          else
            repository=evgeny-simplex/simplex-chat
            commit=$CORE
            ln -s "$GITHUB_WORKSPACE" "$project/hjt"
          fi
          for file in src/Simplex/Chat/Image.hs src/Simplex/Chat/Image/DisplayP3-v4.icc; do
            curl -fsSL -o "$project/$file" "https://raw.githubusercontent.com/$repository/$commit/$file"
          done
          python3 -I .github/measure/patch.py "$project/src/Simplex/Chat/Image.hs"
          cp .github/measure/png-measure.cabal "$project/"
          cp .github/measure/src/Main.hs "$project/src/"
          cat > "$project/cabal.project" <<EOF
          packages: . hjt/jpeg-turbo hjt/JuicyPixels-jpeg-turbo hjt/JuicyPixels-spng

          index-state: 2023-12-12T00:00:00Z

          source-repository-package
              type: git
              location: https://github.com/simplex-chat/JuicyPixels-stbir.git
              tag: e0090e14f6348a33b53c11b377cb69df766b02b4
          EOF
          echo "Image.hs of $repository at $commit, hs-jpeg-turbo $(git -C "$project/hjt" rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        working-directory: ${{ runner.temp }}/${{ matrix.version }}
        run: |
          cabal update
          cabal build exe:resize
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$(cabal list-bin exe:resize)" "$RUNNER_TEMP/bin/resize-${{ matrix.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: resize-${{ matrix.version }}
          path: ${{ runner.temp }}/bin/resize-${{ matrix.version }}

  inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - id: cache
        uses: actions/cache@v4
        with:
          path: inputs
          key: measure-inputs-${{ hashFiles('.github/measure/corpus.tsv', '.github/measure/inputs.py') }}

      - name: Generate the largest accepted images, download the corpus
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow==11.0.0
          "$RUNNER_TEMP/venv/bin/python" -I .github/measure/inputs.py generate inputs/generated
          "$RUNNER_TEMP/venv/bin/python" -I .github/measure/inputs.py download .github/measure/corpus.tsv inputs
          mkdir -p inputs/fixtures
          for file in logo-large-rgba.png preview-issue1.png; do
            curl -fsSL -o "inputs/fixtures/$file" "https://raw.githubusercontent.com/simplex-chat/simplex-chat/$BASE_CORE/tests/fixtures/$file"
          done

      - name: List the inputs
        run: ls -lR inputs | tee -a "$GITHUB_STEP_SUMMARY"

  memory:
    needs: [build, inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache/restore@v4
        with:
          path: inputs
          key: measure-inputs-${{ hashFiles('.github/measure/corpus.tsv', '.github/measure/inputs.py') }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          pattern: resize-*
          path: bin
          merge-multiple: true

      - name: Measure decoding and resizing at the limits of mobile and desktop builds
        run: |
          sudo apt-get install -y time
          chmod +x bin/*
          python3 -I .github/measure/run.py memory bin results inputs .github/measure/corpus.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: memory
          path: |
            results/memory.json
            results/stages.json

  quality:
    needs: [build, inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        set: [png, jpeg]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache/restore@v4
        with:
          path: inputs
          key: measure-inputs-${{ hashFiles('.github/measure/corpus.tsv', '.github/measure/inputs.py') }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          pattern: resize-*
          path: bin
          merge-multiple: true

      - name: Resize the ${{ matrix.set }} corpus with each variant
        run: |
          sudo apt-get install -y time
          chmod +x bin/*
          python3 -I .github/measure/run.py resize bin ${{ matrix.set }} results inputs .github/measure/corpus.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.set }}
          path: results

  equality:
    needs: [build, inputs]
    if: inputs.core != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/cache/restore@v4
        with:
          path: inputs
          key: measure-inputs-${{ hashFiles('.github/measure/corpus.tsv', '.github/measure/inputs.py') }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          pattern: resize-*
          path: bin
          merge-multiple: true

      - name: Compare the outputs of master and of the new Image.hs, sides at most 4320
        run: |
          sudo apt-get install -y time
          chmod +x bin/*
          python3 -I .github/measure/run.py equality bin/resize-base bin/resize-new results inputs .github/measure/corpus.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: equality
          path: results/equality.json

  report:
    needs: [memory, quality, equality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/cache/restore@v4
        with:
          path: inputs
          key: measure-inputs-${{ hashFiles('.github/measure/corpus.tsv', '.github/measure/inputs.py') }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          path: results/quality
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: memory
          path: results/memory

      - uses: actions/download-artifact@v4
        if: inputs.core != ''
        with:
          name: equality
          path: results/equality

      - id: ssimulacra2
        uses: actions/cache@v4
        with:
          path: ~/ssimulacra2
          key: ssimulacra2-libjxl-v0.11.1-ubuntu-24.04

      - name: Install the libraries of ssimulacra2
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libpng-dev libgif-dev libjpeg-dev

      - name: Build ssimulacra2 of libjxl v0.11.1
        if: steps.ssimulacra2.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch v0.11.1 https://github.com/libjxl/libjxl "$RUNNER_TEMP/libjxl"
          git -C "$RUNNER_TEMP/libjxl" submodule update --init --quiet third_party/brotli third_party/highway third_party/skcms
          cmake -S "$RUNNER_TEMP/libjxl" -B "$RUNNER_TEMP/libjxl-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF \
            -DJPEGXL_ENABLE_DEVTOOLS=ON -DJPEGXL_ENABLE_BENCHMARK=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_SJPEG=OFF -DJPEGXL_ENABLE_JPEGLI=OFF -DJPEGXL_ENABLE_OPENEXR=OFF -DJPEGXL_ENABLE_JNI=OFF -DJPEGXL_ENABLE_DOXYGEN=OFF
          cmake --build "$RUNNER_TEMP/libjxl-build" --target ssimulacra2
          mkdir -p ~/ssimulacra2
          cp "$RUNNER_TEMP/libjxl-build/tools/ssimulacra2" ~/ssimulacra2/

      - name: Score the outputs with SSIMULACRA2 at display sizes, write the report
        run: |
          package=JuicyPixels-spng
          sources=$(sed -n '/^library$/,/^$/p' $package/$package.cabal | grep -oE 'cbits/libspng/[^ ]+\.c|cbits/miniz/[^ ]+\.c' | sed "s|^|$package/|")
          options=$(sed -n '/^library$/,/^$/s/^  cc-options: //p' $package/$package.cabal)
          gcc -O2 $options -I $package/cbits -I $package/cbits/libspng/spng -I $package/cbits/miniz $sources .github/measure/decode.c -lm -o "$RUNNER_TEMP/decode"
          ldd ~/ssimulacra2/ssimulacra2
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow==11.0.0
          "$RUNNER_TEMP/venv/bin/python" -I .github/measure/run.py score ~/ssimulacra2/ssimulacra2 "$RUNNER_TEMP/decode" results inputs .github/measure/corpus.tsv results/quality
          "$RUNNER_TEMP/venv/bin/python" -I .github/measure/run.py report results
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: measurements
          path: |
            results/report.md
            results/scores.json
            results/memory/*.json
            results/equality/*.json
            results/quality/*.json
