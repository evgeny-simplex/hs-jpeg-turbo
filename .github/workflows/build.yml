name: build

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GEN: dist-newstyle/wasm-gen
  FIXTURES: dist-newstyle/wasm-fixtures
  WASM_VARIANT: sse2

jobs:
  generate:
    name: libwebp to WebAssembly and C, WebP fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download wasi-sdk 34, wabt 1.0.42 and the SSE2 headers of Emscripten 6.0.13
        run: |
          tools=$RUNNER_TEMP/tools
          mkdir -p "$tools/wasi-sdk" "$tools/wabt" "$tools/wabt-src" "$tools/emscripten"
          curl -fsSL -o "$tools/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          curl -fsSL -o "$tools/wabt.tar.gz" https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz
          curl -fsSL -o "$tools/wabt-src.tar.xz" https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42.tar.xz
          for header in xmmintrin.h emmintrin.h; do
            curl -fsSL -o "$tools/emscripten/$header" "https://raw.githubusercontent.com/emscripten-core/emscripten/e13ee988ce3d87a738dd8f3661d02223308c412a/system/include/compat/$header"
          done
          sha256sum --check <<EOF
          b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $tools/wasi-sdk.tar.gz
          84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131  $tools/wabt.tar.gz
          a76cda3c174a43097863a07fc0b0c202f770f53e21806ea2636f167d1ffb1e30  $tools/wabt-src.tar.xz
          9d3ebd5ec58e07bc97a788cd0ef21559adcbbc5f11bb779eb1864f45f8d167b9  $tools/emscripten/xmmintrin.h
          ca357b61aa173bd5e617bc0b149c0165b57d21210787eeff5367175dfe63c947  $tools/emscripten/emmintrin.h
          EOF
          tar -xzf "$tools/wasi-sdk.tar.gz" -C "$tools/wasi-sdk" --strip-components=1
          tar -xzf "$tools/wabt.tar.gz" -C "$tools/wabt" --strip-components=1
          tar -xJf "$tools/wabt-src.tar.xz" -C "$tools/wabt-src" --strip-components=1
          {
            echo "WASI_SDK=$tools/wasi-sdk"
            echo "WABT=$tools/wabt"
            echo "WABT_SRC=$tools/wabt-src"
            echo "EMSCRIPTEN_COMPAT=$tools/emscripten"
          } >> "$GITHUB_ENV"

      - name: Compile libwebp to WebAssembly and translate it to C
        run: bash .github/scripts/wasm-generate.sh "$GEN"

      - name: Encode the WebP fixtures
        run: bash .github/scripts/wasm-fixtures.sh "$FIXTURES"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-gen
          path: ${{ env.GEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-fixtures
          path: ${{ env.FIXTURES }}

  measure:
    name: native and wasm2c builds on ${{ matrix.os }}
    needs: generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - &download-gen
        uses: actions/download-artifact@v4
        with:
          name: wasm-gen
          path: ${{ env.GEN }}

      - &download-fixtures
        uses: actions/download-artifact@v4
        with:
          name: wasm-fixtures
          path: ${{ env.FIXTURES }}

      - &test-data
        name: Clone libwebp test data
        run: |
          git clone --quiet https://chromium.googlesource.com/webm/libwebp-test-data "$RUNNER_TEMP/libwebp-test-data"
          git -C "$RUNNER_TEMP/libwebp-test-data" checkout --quiet 06ddd96e276c2c638a72d39d3c0f340afd61978c
          echo "WEBP_TEST_DATA=$RUNNER_TEMP/libwebp-test-data" >> "$GITHUB_ENV"

      - name: Install GNU time and clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y time clang

      - name: Show the CPU
        run: |
          if [ "$RUNNER_OS" = Linux ]; then lscpu; else sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; fi

      - name: Measure decoding by the native and wasm2c builds
        run: bash .github/scripts/wasm-measure.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-measure-${{ matrix.os }}
          path: dist-newstyle/wasm-measure/*.tsv

  sanitizers:
    name: wasm2c build with sanitizers, truncated and changed inputs
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - *download-gen
      - *download-fixtures
      - *test-data

      - name: Decode truncated and changed inputs in the sandbox built with address and undefined behaviour sanitizers
        run: |
          out=dist-newstyle/wasm-sanitizers
          mkdir -p "$out"
          clang --version | sed -n 1p
          for check in bounds guard; do
            mode=$([ $check = bounds ] && echo BOUNDS_CHECK || echo GUARD_PAGES)
            clang -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -DWASM_RT_MEMCHECK_$mode=1 -DSANDBOX \
              -I "$GEN" -I "$GEN/scalar" -I "$GEN/simde" -I webp-sandbox/cbits "$GEN/scalar/webp-wasm.c" "$GEN"/wasm-rt-impl.c \
              "$GEN"/wasm-rt-mem-impl.c "$GEN"/wasm-rt-exceptions-impl.c webp-sandbox/cbits/host.c .github/scripts/wasm-bench.c -lpthread -lm \
              -o "$out/$check.exe"
          done
          conformance=$(sed -n 's|^[0-9a-f]*  \(.*\.webp\)\.pam$|'"$WEBP_TEST_DATA"'/\1|p' "$WEBP_TEST_DATA/libwebp_tests.md5")
          failed=0
          {
            echo "### wasm2c scalar build, clang with -fsanitize=address,undefined"
            echo '```'
            for check in bounds guard; do
              echo "== $check"
              "$out/$check.exe" trap 2>&1 || failed=1
              for side in 16384 64; do
                "$out/$check.exe" fuzz $side $conformance "$FIXTURES"/*.webp 2>&1 || failed=1
              done
            done
            echo '```'
            echo "failed=$failed" > "$out/failed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$out/failed"
          grep -q 'failed=0' "$out/failed"

  clang-versions:
    name: native and wasm2c builds by clang 14 to 21 on ubuntu-24.04-arm
    needs: generate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - *download-gen
      - *download-fixtures
      - *test-data

      - name: Install the clang versions of Ubuntu 24.04
        run: |
          sudo apt-get update
          for version in 14 15 16 17 18 19 20 21; do
            sudo apt-get install -y clang-$version || echo "clang-$version is not available"
          done

      - name: Measure decoding by the native and wasm2c builds of each clang version
        run: bash .github/scripts/wasm-clang.sh

  armv7:
    name: armv7 native and wasm2c builds on ubuntu-24.04-arm
    needs: generate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - *download-gen
      - *download-fixtures
      - *test-data

      - name: Install the armv7 cross compiler and GNU time
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf time clang
          arm-linux-gnueabihf-gcc --version

      - name: Measure decoding by the armv7 native and wasm2c builds
        run: bash .github/scripts/wasm-armv7.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-measure-armv7
          path: dist-newstyle/wasm-armv7/*.tsv

  haskell:
    name: webp-sandbox on ${{ matrix.os }}, GHC ${{ matrix.ghc }}
    needs: generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: 9.6.3
          - os: ubuntu-22.04
            ghc: 8.10.7
          - os: ubuntu-22.04-arm
            ghc: 9.6.3
          - os: macos-latest
            ghc: 9.6.3
          - os: windows-latest
            ghc: 9.6.3
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Point Command Line Tools SDK to Xcode SDK
        if: runner.os == 'macOS'
        run: sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - id: setup
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 3.10.2.0

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: store-${{ matrix.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('*/*.cabal') }}
          restore-keys: store-${{ matrix.os }}-ghc${{ matrix.ghc }}-

      - *download-gen
      - *download-fixtures
      - *test-data

      - name: Copy the ${{ env.WASM_VARIANT }} module and the wasm2c runtime into the package
        run: |
          mkdir -p webp-sandbox/gen
          cp "$GEN/$WASM_VARIANT"/webp-wasm.c "$GEN/$WASM_VARIANT"/webp-wasm.h "$GEN"/wasm-rt* webp-sandbox/gen/
          cp -r "$GEN/simde" webp-sandbox/gen/

      - run: cabal build --enable-tests webp-sandbox:lib:webp-sandbox webp-sandbox:test:webp-sandbox-test webp-sandbox:exe:webp-sandbox-bench

      - name: Report the size of the library
        run: |
          lib=$(find dist-newstyle -name 'libHSwebp-sandbox-*.a' -not -name '*_p.a')
          echo "webp-sandbox library, $RUNNER_OS $RUNNER_ARCH, GHC ${{ matrix.ghc }}: $(wc -c < "$lib") bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test decoding in the sandbox against the native build
        run: cabal test --enable-tests webp-sandbox --test-show-details=direct
        env:
          FIXTURES: ${{ github.workspace }}/${{ env.FIXTURES }}

      - name: Time decoding through the Haskell binding
        run: |
          bench=$(cabal list-bin --enable-tests webp-sandbox:exe:webp-sandbox-bench)
          {
            echo "### Haskell binding, $RUNNER_OS $RUNNER_ARCH, GHC ${{ matrix.ghc }}, the $WASM_VARIANT module with bounds checks"
            echo
            "$bench" "$FIXTURES"/*.webp
          } | tee -a "$GITHUB_STEP_SUMMARY"
