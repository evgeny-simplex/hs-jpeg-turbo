name: build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full matrix and the armv7 job
        type: boolean
        default: false
      measure:
        description: Run the sandbox measurements on every target
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.os }}, GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: 9.6.3
    env: &build-env
      mozjpeg_cmake: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR:PATH=lib -DBUILD=20250623 -DBUILD_SHARED_LIBS=OFF -DPNG_SUPPORTED=OFF -DWITH_ARITH_DEC=1 -DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    steps: &build-steps
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Point Command Line Tools SDK to Xcode SDK
        if: runner.os == 'macOS'
        run: sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - id: setup
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 3.10.2.0

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: store-${{ matrix.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('*/*.cabal') }}
          restore-keys: store-${{ matrix.os }}-ghc${{ matrix.ghc }}-

      - name: Select GHC's C compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "ghc_cc=$(ghc --print-libdir)/../mingw/bin/clang.exe" >> "$GITHUB_ENV"
          echo "ghc_ldflags=-fuse-ld=lld --rtlib=compiler-rt" >> "$GITHUB_ENV"

      - name: Show C compiler macros
        env:
          CC: ${{ env.ghc_cc }}
        run: |
          echo > "$RUNNER_TEMP/empty.c"
          "${CC:-cc}" --version
          "${CC:-cc}" -dM -E "$RUNNER_TEMP/empty.c" | grep -E ' (__SIZEOF_SIZE_T__|__SIZEOF_LONG__|__aarch64__|__x86_64__|_WIN32|__APPLE__|__ELF__|__clang__|__GNUC__) '

      - run: cabal build --enable-tests all

      - name: Report the sizes of the WebP and sandbox libraries
        run: |
          for package in JuicyPixels-libwebp JuicyPixels-sandbox; do
            lib=$(find dist-newstyle -name "libHS$package-*.a" -not -name '*_p.a')
            {
              echo "$package library, $RUNNER_OS $RUNNER_ARCH, GHC ${{ matrix.ghc }}: $(wc -c < "$lib") bytes"
              if [ "$RUNNER_OS" = Linux ]; then size -t "$lib" | sed -n '1p;$p'; fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Check that the sandbox library uses no thread-local storage
        if: runner.os != 'Windows'
        run: |
          lib=$(find dist-newstyle -name 'libHSJuicyPixels-sandbox-*.a' -not -name '*_p.a')
          if [ "$RUNNER_OS" = macOS ]; then
            if otool -l "$lib" | grep -E 'sectname __thread_'; then exit 1; fi
          else
            if readelf -S -W "$lib" | grep -E '\.t(data|bss)'; then exit 1; fi
          fi
          if nm -A "$lib" | grep -E '__tls_get_addr|__emutls|_tlv_'; then exit 1; fi

      - name: Show Neon symbols in the library
        if: runner.arch == 'ARM64'
        run: |
          lib=$(find dist-newstyle -name 'libHSjpeg-turbo-*.a' -not -name '*_p.a')
          nm -A -g "$lib" | grep -E 'neon\.o.* T _?jsimd_'
          nm -A -g "$lib" | grep -E 'jsimd\.o.* T _?jsimd_can_'

      - &webp-test-data
        name: Clone libwebp test data, encode tall WebP files with their source pixels
        env:
          CC: ${{ env.ghc_cc }}
          LDFLAGS: ${{ env.ghc_ldflags }}
        run: |
          git clone --quiet https://chromium.googlesource.com/webm/libwebp-test-data "$RUNNER_TEMP/libwebp-test-data"
          git -C "$RUNNER_TEMP/libwebp-test-data" checkout --quiet 06ddd96e276c2c638a72d39d3c0f340afd61978c
          libwebp=JuicyPixels-libwebp/cbits/libwebp
          mkdir -p dist-newstyle
          "${CC:-cc}" -O2 -I "$libwebp" -I "$libwebp/src" "$libwebp"/src/*/*.c "$libwebp"/sharpyuv/*.c .github/scripts/webp-encode.c ${LDFLAGS:-} -lm -o dist-newstyle/webp-encode.exe
          dist-newstyle/webp-encode.exe "$RUNNER_TEMP/libwebp-test-data"
          echo "WEBP_TEST_DATA=$RUNNER_TEMP/libwebp-test-data" >> "$GITHUB_ENV"

      - run: cabal test --enable-tests --test-show-details=direct all

      - name: Build mozjpeg with CMake (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_ARCH" = X64 ]; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y nasm
            else
              brew install nasm
            fi
          fi
          cmake -S jpeg-turbo/cbits/mozjpeg -B "$RUNNER_TEMP/mozjpeg-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mozjpeg" $mozjpeg_cmake
          cmake --build "$RUNNER_TEMP/mozjpeg-build" --target install --parallel
          echo "MOZJPEG_PREFIX=$RUNNER_TEMP/mozjpeg" >> "$GITHUB_ENV"

      - name: Compare neon-compat.h with the header generated by CMake
        if: runner.arch == 'ARM64'
        run: |
          macros() {
            cc -dM -E -include "$1" -x c /dev/null | sed -n 's/^#define \(HAVE_VLD1[A-Z0-9_]*\).*/\1/p' | sort
          }
          macros jpeg-turbo/cbits/neon-compat.h > "$RUNNER_TEMP/neon-compat-cabal.txt"
          macros "$RUNNER_TEMP/mozjpeg-build/simd/arm/neon-compat.h" > "$RUNNER_TEMP/neon-compat-cmake.txt"
          cat "$RUNNER_TEMP/neon-compat-cmake.txt"
          diff "$RUNNER_TEMP/neon-compat-cabal.txt" "$RUNNER_TEMP/neon-compat-cmake.txt"

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: simplex-chat/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: make
          pacboy: >-
            toolchain:p
            cmake:p
            nasm:p

      - name: Build mozjpeg with CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: ${{ env.ghc_cc }}
          LDFLAGS: ${{ env.ghc_ldflags }}
        run: |
          export CC=$(cygpath -m "$CC")
          tmp=$(cygpath -m "$RUNNER_TEMP")
          cmake -S jpeg-turbo/cbits/mozjpeg -B "$tmp/mozjpeg-build" -DCMAKE_INSTALL_PREFIX="$tmp/mozjpeg" $mozjpeg_cmake
          cmake --build "$tmp/mozjpeg-build" --target install --parallel
          echo "MOZJPEG_PREFIX=$tmp/mozjpeg" >> "$GITHUB_ENV"

      - name: Compare JPEGs encoded by the cabal and CMake builds
        env:
          CC: ${{ env.ghc_cc }}
          LDFLAGS: ${{ env.ghc_ldflags }}
        run: bash .github/scripts/output-check.sh

      - name: Report test coverage
        if: matrix.os == 'ubuntu-22.04' && matrix.ghc == '9.6.3'
        run: bash .github/scripts/coverage.sh

  sandbox-generate:
    name: image decoders to WebAssembly and C, compared with the committed C
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download wasi-sdk 34, wabt 1.0.42 and the SSE2 headers of Emscripten 6.0.13
        run: |
          tools=$RUNNER_TEMP/tools
          mkdir -p "$tools/wasi-sdk" "$tools/wabt" "$tools/wabt-src" "$tools/emscripten"
          curl -fsSL -o "$tools/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          curl -fsSL -o "$tools/wabt.tar.gz" https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz
          curl -fsSL -o "$tools/wabt-src.tar.xz" https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42.tar.xz
          for header in xmmintrin.h emmintrin.h; do
            curl -fsSL -o "$tools/emscripten/$header" "https://raw.githubusercontent.com/emscripten-core/emscripten/e13ee988ce3d87a738dd8f3661d02223308c412a/system/include/compat/$header"
          done
          sha256sum --check <<EOF
          b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $tools/wasi-sdk.tar.gz
          84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131  $tools/wabt.tar.gz
          a76cda3c174a43097863a07fc0b0c202f770f53e21806ea2636f167d1ffb1e30  $tools/wabt-src.tar.xz
          9d3ebd5ec58e07bc97a788cd0ef21559adcbbc5f11bb779eb1864f45f8d167b9  $tools/emscripten/xmmintrin.h
          ca357b61aa173bd5e617bc0b149c0165b57d21210787eeff5367175dfe63c947  $tools/emscripten/emmintrin.h
          EOF
          tar -xzf "$tools/wasi-sdk.tar.gz" -C "$tools/wasi-sdk" --strip-components=1
          tar -xzf "$tools/wabt.tar.gz" -C "$tools/wabt" --strip-components=1
          tar -xJf "$tools/wabt-src.tar.xz" -C "$tools/wabt-src" --strip-components=1
          {
            echo "WASI_SDK=$tools/wasi-sdk"
            echo "WABT=$tools/wabt"
            echo "WABT_SRC=$tools/wabt-src"
            echo "EMSCRIPTEN_COMPAT=$tools/emscripten"
          } >> "$GITHUB_ENV"

      - name: Compile the decoders to WebAssembly, add budget checks and translate them to C
        run: bash .github/scripts/wasm-generate.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-generated
          path: JuicyPixels-sandbox/cbits

      - name: Compare the generated files with the committed files
        run: |
          git add --intent-to-add JuicyPixels-sandbox/cbits
          git diff --stat --exit-code -- JuicyPixels-sandbox/cbits

  build-full:
    name: ${{ matrix.os }}, GHC ${{ matrix.ghc }}
    if: &full-run ${{ !((github.event_name == 'workflow_dispatch' && !inputs.full) || github.event.pull_request.draft == true || (github.event_name == 'push' && github.repository != 'simplex-chat/hs-jpeg-turbo')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: 8.10.7
          - os: ubuntu-22.04-arm
            ghc: 9.6.3
          - os: macos-latest
            ghc: 9.6.3
          - os: macos-15-intel
            ghc: 9.6.3
          - os: windows-latest
            ghc: 9.6.3
    env: *build-env
    steps: *build-steps

  armv7:
    name: armv7 on ubuntu-24.04-arm, Neon and C
    if: *full-run
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install the armv7 cross compiler and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf clang-18 libclang-rt-18-dev
          arm-linux-gnueabihf-gcc --version
          clang-18 --version

      - name: Compare neon-compat.h with the header generated by CMake
        run: |
          flags="-march=armv7-a -mfpu=neon -mfloat-abi=hard"
          cmake -S jpeg-turbo/cbits/mozjpeg -B "$RUNNER_TEMP/mozjpeg-build" -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_C_FLAGS="$flags" -DBUILD_SHARED_LIBS=OFF -DPNG_SUPPORTED=OFF
          macros() {
            arm-linux-gnueabihf-gcc $flags -dM -E -include "$1" -x c /dev/null | sed -n 's/^#define \(HAVE_VLD1[A-Z0-9_]*\).*/\1/p' | sort
          }
          macros jpeg-turbo/cbits/neon-compat.h > "$RUNNER_TEMP/neon-compat-cabal.txt"
          macros "$RUNNER_TEMP/mozjpeg-build/simd/arm/neon-compat.h" > "$RUNNER_TEMP/neon-compat-cmake.txt"
          cat "$RUNNER_TEMP/neon-compat-cmake.txt"
          diff "$RUNNER_TEMP/neon-compat-cabal.txt" "$RUNNER_TEMP/neon-compat-cmake.txt"

      - name: Compare JPEGs encoded with Neon and with the C code paths
        run: bash .github/scripts/armv7-check.sh

      - name: Compare PNGs decoded by the armv7 and aarch64 builds, decode changed files with sanitizers
        run: bash .github/scripts/png-check.sh

      - *webp-test-data

      - name: Compare WebP files decoded by the armv7 and aarch64 builds, decode changed files with sanitizers
        run: bash .github/scripts/webp-check.sh

  sandbox-sanitizers:
    name: sandbox with sanitizers on truncated and changed images
    if: *full-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Clone libwebp test data
        run: |
          git clone --quiet https://chromium.googlesource.com/webm/libwebp-test-data "$RUNNER_TEMP/libwebp-test-data"
          git -C "$RUNNER_TEMP/libwebp-test-data" checkout --quiet 06ddd96e276c2c638a72d39d3c0f340afd61978c

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev

      - name: Decode truncated and changed images in the sandbox with address and undefined behaviour sanitizers
        env:
          CC: clang-18
          WEBP_TEST_DATA: ${{ runner.temp }}/libwebp-test-data
        run: bash .github/scripts/sandbox-sanitize.sh

  sandbox-fixtures:
    name: sandbox workloads and the largest picked images
    if: ${{ inputs.measure }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Encode the workloads and the largest picked images
        run: bash .github/scripts/sandbox-fixtures.sh "$RUNNER_TEMP/sandbox-fixtures"

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-fixtures
          path: ${{ runner.temp }}/sandbox-fixtures

  sandbox-measure:
    name: sandbox measurements on ${{ matrix.platform }}
    needs: sandbox-fixtures
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            os: ubuntu-24.04
            count: 1
            configs: |
              gcc|gcc -O2
              clang|clang -O2
              gcc-O3|gcc -O3
              clang-O3|clang -O3
          - platform: Linux aarch64
            os: ubuntu-24.04-arm
            configs: |
              gcc|gcc -O2
              clang|clang -O2
              gcc-O3|gcc -O3
              clang-O3|clang -O3
          - platform: macOS aarch64
            os: macos-latest
            configs: |
              clang|cc -O2
              clang-O3|cc -O3
          - platform: macOS x86-64
            os: macos-15-intel
            configs: |
              clang|cc -O2
              clang-O3|cc -O3
          - platform: Windows x86-64
            os: windows-latest
            libs: -lm
            python: python
            configs: |
              clang|GHC_CC -O2 -fuse-ld=lld --rtlib=compiler-rt
              clang-O3|GHC_CC -O3 -fuse-ld=lld --rtlib=compiler-rt
          - platform: armv7 static on ubuntu-24.04-arm
            os: ubuntu-24.04-arm
            size: arm-linux-gnueabihf-size
            configs: |
              gcc|arm-linux-gnueabihf-gcc -static -march=armv7-a -mfpu=neon -mfloat-abi=hard -O2
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-fixtures
          path: ${{ runner.temp }}/sandbox-fixtures

      - name: Install clang and the armv7 cross compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-arm-linux-gnueabihf

      - uses: simplex-chat/setup-haskell-action@v2
        if: runner.os == 'Windows'
        with:
          ghc-version: 9.6.3
          cabal-version: 3.10.2.0

      - name: Select GHC's C compiler (Windows)
        if: runner.os == 'Windows'
        run: echo "ghc_cc=$(cygpath -m "$(ghc --print-libdir)/../mingw/bin/clang.exe")" >> "$GITHUB_ENV"

      - name: Show the CPU
        run: |
          case $RUNNER_OS in
            Linux) lscpu ;;
            macOS) sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors" ;;
          esac

      - name: Clone libwebp test data
        run: |
          git clone --quiet https://chromium.googlesource.com/webm/libwebp-test-data "$RUNNER_TEMP/libwebp-test-data"
          git -C "$RUNNER_TEMP/libwebp-test-data" checkout --quiet 06ddd96e276c2c638a72d39d3c0f340afd61978c

      - name: Measure the sandbox against the native decoders
        env:
          CONFIGS: ${{ matrix.configs }}
          COUNT: ${{ matrix.count }}
          SIZE: ${{ matrix.size }}
          LIBS: ${{ matrix.libs }}
          PYTHON: ${{ matrix.python }}
          FIXTURES: ${{ runner.temp }}/sandbox-fixtures
          WEBP_TEST_DATA: ${{ runner.temp }}/libwebp-test-data
        run: |
          configs=()
          while IFS= read -r config; do
            configs+=("${config/GHC_CC/${ghc_cc:-}}")
          done < <(printf '%s\n' "$CONFIGS" | sed '/^$/d')
          bash .github/scripts/sandbox-measure.sh "${{ matrix.platform }}" "${configs[@]}"

  sandbox-android-build:
    name: sandbox builds by the compilers of the core's nix builds for Android
    if: ${{ inputs.measure }}
    runs-on: ubuntu-24.04
    env:
      SIMPLEX_CHAT_REV: 9c502559140e62c888f4c6af9e2a3ecdf11963bb
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Nix with the caches of the core's Android build
        run: bash .github/scripts/sandbox-nix.sh

      - name: Fetch the C compilers of the core's armv7a and aarch64 builds
        run: |
          for target in armv7a aarch64; do
            nix build -L --impure --out-link "$RUNNER_TEMP/cc-$target" --expr "import ./.github/scripts/sandbox-cc.nix { rev = \"$SIMPLEX_CHAT_REV\"; target = \"$target\"; }"
            ls "$RUNNER_TEMP/cc-$target/bin"
            cc=$(ls "$RUNNER_TEMP/cc-$target"/bin/*-cc | head -1)
            "$cc" --version
            echo "cc_$target=$cc" >> "$GITHUB_ENV"
          done
          echo "ld_aarch64=$(ls "$RUNNER_TEMP"/cc-aarch64/bin/*-ld.lld | head -1)" >> "$GITHUB_ENV"
          unwind=$(nix-store -qR "$(readlink -f "$RUNNER_TEMP/cc-aarch64")" | grep -E -- '-libunwind-aarch64-unknown-linux-android-[0-9.]+$' | head -1)
          ls "$unwind/lib"
          echo "unwind_aarch64=$unwind/lib" >> "$GITHUB_ENV"

      - name: Check the sandbox objects for thread-local storage
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          bash .github/scripts/sandbox-tls.sh "Android armv7a" "$cc_armv7a"
          bash .github/scripts/sandbox-tls.sh "Android aarch64" "$cc_aarch64"

      - name: Build the native and sandboxed decoders
        env:
          BUILD_ONLY: 1
          LIBS: -lm
          SIZE: llvm-size
          FIXTURES: /nonexistent
          WEBP_TEST_DATA: /nonexistent
        run: |
          configs=()
          for level in O2 O3; do
            suffix=${level/O2/}
            configs+=("ndk-armv7a${suffix:+-$suffix}|$cc_armv7a -static -$level -Wno-pass-failed")
            configs+=("ndk-armv7a-neon${suffix:+-$suffix}|$cc_armv7a -static -$level -mfpu=neon -Wno-pass-failed")
            configs+=("nixpkgs-aarch64${suffix:+-$suffix}|$cc_aarch64 -static -$level -Wno-pass-failed --ld-path=$ld_aarch64 -L$unwind_aarch64")
          done
          bash .github/scripts/sandbox-measure.sh "Android, the core's nix compilers" "${configs[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-android
          path: dist-newstyle/sandbox-measure/*.exe

  sandbox-android-run:
    name: sandbox measurements of the Android builds on ubuntu-24.04-arm
    needs: [sandbox-fixtures, sandbox-android-build]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-fixtures
          path: ${{ runner.temp }}/sandbox-fixtures

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-android
          path: dist-newstyle/sandbox-measure

      - name: Clone libwebp test data
        run: |
          git clone --quiet https://chromium.googlesource.com/webm/libwebp-test-data "$RUNNER_TEMP/libwebp-test-data"
          git -C "$RUNNER_TEMP/libwebp-test-data" checkout --quiet 06ddd96e276c2c638a72d39d3c0f340afd61978c

      - name: Show the last system calls of the Android builds on one image
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
          chmod +x dist-newstyle/sandbox-measure/*.exe
          mkdir -p "$RUNNER_TEMP/one"
          for exe in dist-newstyle/sandbox-measure/native-ndk-armv7a.exe dist-newstyle/sandbox-measure/sandbox-ndk-armv7a.exe dist-newstyle/sandbox-measure/native-nixpkgs-aarch64.exe dist-newstyle/sandbox-measure/sandbox-nixpkgs-aarch64.exe; do
            echo "== $exe"
            file "$exe"
            status=0
            strace -f -o "$RUNNER_TEMP/trace" "$exe" check "$RUNNER_TEMP/one" 64 jpeg-turbo/cbits/mozjpeg/testimages/testorig.jpg || status=$?
            echo "exit status $status"
            tail -25 "$RUNNER_TEMP/trace"
          done

      - name: Measure the sandbox against the native decoders
        env:
          PREBUILT: 1
          FIXTURES: ${{ runner.temp }}/sandbox-fixtures
          WEBP_TEST_DATA: ${{ runner.temp }}/libwebp-test-data
        run: |
          bash .github/scripts/sandbox-measure.sh "Android builds on Linux aarch64" "ndk-armv7a|" "ndk-armv7a-neon|" "nixpkgs-aarch64|" \
            "ndk-armv7a-O3|" "ndk-armv7a-neon-O3|" "nixpkgs-aarch64-O3|"

  sandbox-ios:
    name: sandbox measurements of the build by the compiler of the core's nix build for iOS
    needs: sandbox-fixtures
    runs-on: macos-latest
    env:
      SIMPLEX_CHAT_REV: 9c502559140e62c888f4c6af9e2a3ecdf11963bb
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-fixtures
          path: ${{ runner.temp }}/sandbox-fixtures

      - name: Install Nix with the caches of the core's builds
        run: bash .github/scripts/sandbox-nix.sh

      - name: Fetch the C compiler of the core's iOS build
        run: |
          nix build -L --impure --out-link "$RUNNER_TEMP/cc-ios" --expr "import ./.github/scripts/sandbox-cc.nix { rev = \"$SIMPLEX_CHAT_REV\"; target = \"ios\"; }"
          "$RUNNER_TEMP/cc-ios/bin/cc" --version

      - name: Check the sandbox objects for thread-local storage
        run: bash .github/scripts/sandbox-tls.sh "iOS" "$RUNNER_TEMP/cc-ios/bin/cc"

      - name: Clone libwebp test data
        run: |
          git clone --quiet https://chromium.googlesource.com/webm/libwebp-test-data "$RUNNER_TEMP/libwebp-test-data"
          git -C "$RUNNER_TEMP/libwebp-test-data" checkout --quiet 06ddd96e276c2c638a72d39d3c0f340afd61978c

      - name: Measure the sandbox against the native decoders
        env:
          FIXTURES: ${{ runner.temp }}/sandbox-fixtures
          WEBP_TEST_DATA: ${{ runner.temp }}/libwebp-test-data
        run: |
          bash .github/scripts/sandbox-measure.sh "macOS aarch64, the compiler of the core's iOS build" "nixpkgs-clang|$RUNNER_TEMP/cc-ios/bin/cc -O2" \
            "nixpkgs-clang-O3|$RUNNER_TEMP/cc-ios/bin/cc -O3"
