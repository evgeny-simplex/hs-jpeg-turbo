name: build

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: WebP fixtures and libwebp decoding memory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Encode the WebP fixtures of simplex-chat with cwebp 1.6.0
        run: bash .github/scripts/measure-fixtures.sh

      - name: Measure the memory of libwebp decoding at v1.6.0 and f054d0c3
        run: |
          sudo apt-get update
          sudo apt-get install -y time
          bash .github/scripts/measure-memory.sh

      - uses: actions/upload-artifact@v4
        with:
          name: webp-fixtures
          path: dist-newstyle/measure/fixtures
