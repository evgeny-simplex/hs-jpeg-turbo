name: JuicyPixels-jpeg-turbo
version: "0.1.0.0"
git: https://gitlab.com/dpwiz/hs-jpeg-turbo
license: BSD-3-Clause
author: "IC Rainbow"
maintainer: "aenor.realm@gmail.com"
copyright: "2024 IC Rainbow"

extra-source-files:
- CHANGELOG.md

synopsis: JuicyPixels wrappers for libjpeg-turbo
# description:

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src
  dependencies:
  - jpeg-turbo
  - JuicyPixels
  - bytestring
  - vector

tests:
  JuicyPixels-jpeg-turbo-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - bytestring
    - jpeg-turbo # XXX
    - JuicyPixels
    - JuicyPixels-jpeg-turbo
    - tasty
    - tasty-discover
    - tasty-hunit

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

default-extensions:
- BangPatterns
- BlockArguments
- ImportQualifiedPost
- LambdaCase
- NamedFieldPuns
- OverloadedStrings
- PatternSynonyms
- RecordWildCards
- TupleSections
- TypeApplications
- TypeOperators
