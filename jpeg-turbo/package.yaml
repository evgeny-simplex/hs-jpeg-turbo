  - cbits/libjpeg-turbo/src/jcparam.c
  - cbits/libjpeg-turbo/src/jcphuff.c
  - cbits/libjpeg-turbo/src/jctrans.c
  - cbits/libjpeg-turbo/src/jdapimin.c
