  when:
  - condition: arch(aarch64)
    cc-options: -DNEON_INTRINSICS
    c-sources:
    - cbits/libjpeg-turbo/simd/arm/aarch64/jchuff-neon.c
    - cbits/libjpeg-turbo/simd/arm/aarch64/jsimd.c
    - cbits/libjpeg-turbo/simd/arm/jccolor-neon.c
    - cbits/libjpeg-turbo/simd/arm/jcgray-neon.c
    - cbits/libjpeg-turbo/simd/arm/jcphuff-neon.c
    - cbits/libjpeg-turbo/simd/arm/jcsample-neon.c
    - cbits/libjpeg-turbo/simd/arm/jdcolor-neon.c
    - cbits/libjpeg-turbo/simd/arm/jdmerge-neon.c
    - cbits/libjpeg-turbo/simd/arm/jdsample-neon.c
    - cbits/libjpeg-turbo/simd/arm/jfdctfst-neon.c
    - cbits/libjpeg-turbo/simd/arm/jfdctint-neon.c
    - cbits/libjpeg-turbo/simd/arm/jidctfst-neon.c
    - cbits/libjpeg-turbo/simd/arm/jidctint-neon.c
    - cbits/libjpeg-turbo/simd/arm/jidctred-neon.c
    - cbits/libjpeg-turbo/simd/arm/jquanti-neon.c

tests:
  jpeg-turbo-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - bytestring
    - jpeg-turbo
    - tasty
    - tasty-discover
    - tasty-hunit
    build-tools:
    - tasty-discover:tasty-discover

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wno-missing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

default-extensions:
- BangPatterns
- BlockArguments
- GADTs
- ImportQualifiedPost
- LambdaCase
- NamedFieldPuns
- OverloadedStrings
- PatternSynonyms
- RecordWildCards
- TupleSections
- TypeApplications
- TypeFamilies
