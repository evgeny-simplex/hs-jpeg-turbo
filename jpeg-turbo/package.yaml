name: jpeg-turbo
version: "0.1.0.0"
git: https://gitlab.com/dpwiz/hs-jpeg-turbo
license: BSD-3-Clause
author: "IC Rainbow"
maintainer: "aenor.realm@gmail.com"
copyright: "2024 IC Rainbow"

flags:
  pkgconfig:
    description: Use pkgconfig to find library.
    manual: True
    default: False
  static:
    description: Use extra-libraries for turbojpeg.
    manual: True
    default: False

extra-source-files:
- CHANGELOG.md

category: Codec, Image
synopsis: FFI bindings to libjpeg-turbo
description: |
  Faster and more capable codec for JPEG images using libjpeg-turbo.
  .
  Set one of the flags according to your build environment.
  .
  <https://libjpeg-turbo.org/Documentation>

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src
  dependencies:
  - bytestring >= 0.10 && < 1
  when:
  - condition: flag(pkgconfig)
    pkgconfig-depends:
    - libturbojpeg
  - condition: flag(static)
    extra-libraries: turbojpeg

tests:
  jpeg-turbo-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - bytestring
    - jpeg-turbo
    - tasty
    - tasty-discover
    - tasty-hunit
    build-tools:
    - tasty-discover:tasty-discover

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wno-missing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

default-extensions:
- BangPatterns
- BlockArguments
- GADTs
- ImportQualifiedPost
- LambdaCase
- NamedFieldPuns
- OverloadedStrings
- PatternSynonyms
- RecordWildCards
- TupleSections
- TypeApplications
- TypeFamilies
